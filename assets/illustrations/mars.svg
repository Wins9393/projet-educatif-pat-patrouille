      <stop offset="0" stop-color="#ff9d5c"/>
      <stop offset="55%" stop-color="#e5642f"/>
      <stop offset="100%" stop-color="#a63a17"/>
    </radialGradient>
    <clipPath id="mars-bord"><circle cx="60" cy="62" r="44"/></clipPath>
  </defs>
  <ellipse cx="60" cy="110" rx="34" ry="6" fill="#000" opacity="0.18"/>
  <circle cx="60" cy="62" r="44" fill="url(#mars-corps)"/>
