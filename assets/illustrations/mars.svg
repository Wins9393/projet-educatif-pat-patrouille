    <ellipse cx="58" cy="22" rx="24" ry="12" fill="#fdece2" opacity="0.95"/>
    <ellipse cx="70" cy="100" rx="18" ry="9" fill="#fdece2" opacity="0.6"/>
    <!-- cratères -->
    <circle cx="44" cy="56" r="9" fill="#b8451f" opacity="0.75"/>
    <circle cx="42" cy="54" r="6" fill="#8f3315" opacity="0.55"/>
    <circle cx="78" cy="70" r="7" fill="#b8451f" opacity="0.7"/>
    <circle cx="63" cy="82" r="5" fill="#b8451f" opacity="0.6"/>
    <path d="M30 74 q18 8 36 2 t26 -4" stroke="#8f3315" stroke-width="4" fill="none" opacity="0.35" stroke-linecap="round"/>
  </g>
  <circle cx="60" cy="62" r="44" fill="none" stroke="#7a2a10" stroke-width="3" opacity="0.45"/>
