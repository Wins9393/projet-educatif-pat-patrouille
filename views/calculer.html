<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1b2a4a">
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/decors.css">
    <link rel="stylesheet" href="../styles/jeux.css">
    <link rel="stylesheet" href="../styles/panneaux.css">
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <script src="../vendor/confetti.min.js" defer></script>
    <script type="module" src="../controllers/calculer.js"></script>
    <title>CALCULER</title>
</head>

<body>
    <main class="jeu-page">
        <div class="calculer">
            <p class="consigne">
                <span class="consigne__texte">Remplis avec le bon nombre</span>
                <button class="bouton bouton--discret bouton--icone" data-action="ecouter" aria-label="Réécouter">🔊</button>
            </p>

            <!-- Niveaux 1 et 2 : on manipule des jetons pour composer une quantité -->
            <section class="mode-collecte" hidden>
                <div class="calculer__haut">
                    <div class="objectif">
                        <p class="objectif__etiquette">Objectif</p>
                        <div class="objectif__valeur"></div>
                    </div>

                    <div class="receptacle"></div>

                    <div class="total">
                        <p class="total__etiquette">Total</p>
                        <div class="total__valeur"></div>
                    </div>
                </div>

                <div class="reserve"></div>
            </section>

            <!-- Niveaux 3 et plus : on résout une opération posée -->
            <section class="mode-operation" hidden>
                <div class="operation">
                    <p class="operation__enonce"></p>
                    <div class="operation__illustration"></div>
                </div>

                <div class="choix"></div>
            </section>

            <div class="calculer__bas">
                <button class="bouton" data-action="rejouer">Recommencer</button>
            </div>
        </div>
    </main>
</body>

</html>
