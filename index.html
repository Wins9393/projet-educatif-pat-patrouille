<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Petits jeux pour apprendre à lire, écrire et compter, avec des univers à explorer.">
    <meta name="theme-color" content="#1b2a4a">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/decors.css">
    <link rel="stylesheet" href="styles/accueil.css">
    <link rel="stylesheet" href="styles/panneaux.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/icones/icone-192.png">
    <script type="module" src="index.js"></script>
    <title>Les Petits Mondes</title>
</head>

<body>
    <main class="accueil">
        <div class="accueil__corps">
            <h1 class="accueil__titre">Les Petits Mondes</h1>
            <p class="accueil__sous-titre">Choisis un jeu, puis explore un univers.</p>

            <nav class="jeux" aria-label="Mini-jeux"></nav>

            <section class="bloc">
                <div class="bloc__titre">
                    <span>Univers</span>
                    <button class="bouton bouton--discret" data-action="theme-surprise">🎲 Au hasard</button>
                </div>
                <div class="selecteur-themes"></div>
            </section>

            <section class="bloc">
                <div class="bloc__titre"><span>Mes autocollants</span></div>
                <div class="autocollants"></div>
                <div class="progression-barre">
                    <div class="progression-barre__jauge" style="width: 0%"></div>
                </div>
                <p class="progression-legende"></p>
            </section>
        </div>
    </main>
</body>

</html>
